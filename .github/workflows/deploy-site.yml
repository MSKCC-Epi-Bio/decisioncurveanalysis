name: Build and Deploy Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual triggering
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            python3-dev

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: ${{ runner.os }}-

      - name: Install R dependencies
        run: |
          install.packages("renv")
          renv::restore()
          # Ensure these essential packages are installed
          pkgs <- c("rmarkdown", "knitr", "dcurves", "tidyverse", "gtsummary", "here")
          missing <- setdiff(pkgs, installed.packages()[,"Package"])
          if (length(missing) > 0) install.packages(missing)
        shell: Rscript {0}

      - name: Build site
        run: |
          Rscript -e 'rmarkdown::render_site()'

      - name: Build language-specific tutorials
        run: |
          Rscript -e "languages <- c('r', 'stata', 'sas', 'python'); for (lang in languages) { rmarkdown::render('dca-tutorial.Rmd', output_file = paste0('dca-tutorial-', lang, '.html'), params = list(language = lang)) }"

      - name: Create deployment directory
        run: |
          mkdir -p _deploy
          # Copy generated HTML and libs from root
          cp *.html _deploy/
          cp -r *_files _deploy/ || true
          cp -r site_libs _deploy/ || true
          # Copy the entire assets directory
          cp -r assets _deploy/assets || true
          # Copy Rmd chunks if needed (maybe remove later if not needed on deployed site)
          cp -r rmd_chunks _deploy/rmd_chunks || true
          # Add specialized files for gh-pages branch
          cp gh-pages-gitignore _deploy/.gitignore || true
          cp gh-pages-readme.md _deploy/README.md || true
          # Create a simple .nojekyll file
          touch _deploy/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
