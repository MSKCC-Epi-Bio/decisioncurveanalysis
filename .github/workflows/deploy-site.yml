name: Build and Deploy Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Use bash shell regardless of GitHub Actions runner
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            python3-dev

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: ${{ runner.os }}-

      - name: Install R dependencies
        run: |
          install.packages("renv")
          renv::restore()
          # Ensure these essential packages are installed
          pkgs <- c("rmarkdown", "knitr", "dcurves", "tidyverse", "gtsummary", "here")
          missing <- setdiff(pkgs, installed.packages()[,"Package"])
          if (length(missing) > 0) install.packages(missing)
        shell: Rscript {0}

      - name: Build site
        run: |
          Rscript -e 'rmarkdown::render_site()'

      - name: Create deployment directory
        run: |
          mkdir -p _deploy
          # Copy generated HTML and libs
          cp *.html _deploy/
          cp -r *_files _deploy/ || true # Use || true to avoid error if dir doesn't exist
          cp -r site_libs _deploy/ || true
          # Copy assets and other necessary source dirs from root
          cp -r assets/images _deploy/assets/images || true
          cp -r assets/highlight _deploy/assets/highlight || true
          cp assets/custom.css _deploy/assets/custom.css || true
          cp -r assets/templates _deploy/assets/templates || true
          cp -r assets/data _deploy/assets/data || true
          cp -r rmd_chunks _deploy/rmd_chunks || true # Rmd chunks from root
          # Add specialized files for gh-pages branch
          cp gh-pages-gitignore _deploy/.gitignore || true
          cp gh-pages-readme.md _deploy/README.md || true
          # Create a simple .nojekyll file to tell GitHub not to use Jekyll
          touch _deploy/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _deploy
          clean: true
          git-config-name: GitHub Actions
          git-config-email: actions@github.com
